{% extends 'base.html' %}

{% block title %}Página no encontrada{% endblock %}

{% block content %}
<section class="error-page">
    <div class="error-box">
        <span class="error-badge">404</span>
        <h1>Página no encontrada</h1>
        <p>La página que buscas no existe o ha cambiado de ubicación.</p>

        <div class="error-actions">
            <a href="{% url 'home' %}" class="primary-link">Ir al inicio</a>
            <a href="{% url 'login' %}" class="secondary-link">Iniciar sesión</a>
        </div>
    </div>
</section>
{% endblock %}
