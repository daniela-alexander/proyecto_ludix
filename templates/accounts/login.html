{% extends 'base.html' %}

{% block title %}
Iniciar sesión
{% endblock %}

{% block content %}

<section class="auth-page">
    <div class="auth-card">
        <h1>Iniciar sesión</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                Entrar
            </button>
        </form>
    </div>
</section>

{% endblock %}
