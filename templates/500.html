{% extends 'base.html' %}

{% block title %}Error del servidor{% endblock %}

{% block content %}
<section class="error-page">
    <div class="error-box">
        <span class="error-badge">500</span>
        <h1>Algo ha ido mal</h1>
        <p>Estamos experimentando un error temporal del servidor. Inténtalo de nuevo en unos momentos.</p>

        <div class="error-actions">
            <a href="{% url 'home' %}" class="primary-link">Volver al inicio</a>
            <a href="{% url 'login' %}" class="secondary-link">Intentarlo de nuevo</a>
        </div>
    </div>
</section>
{% endblock %}
