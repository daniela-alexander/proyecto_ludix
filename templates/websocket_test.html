<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludix WebSocket Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1f2937;
            border-radius: 12px;
            padding: 32px;
            width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            margin-top: 0;
        }
        #count {
            font-size: 56px;
            font-weight: bold;
            color: #34d399;
            margin: 20px 0;
        }
        .status {
            color: #93c5fd;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Usuarios conectados</h1>
        <div id="count">0</div>
        <div id="status" class="status">Conectando...</div>
    </div>

    <script>
        const socket = new WebSocket('ws://localhost:8000/ws/usuarios/');

        socket.onopen = function () {
            document.getElementById('status').textContent = 'Conectado';
        };

        socket.onmessage = function (event) {
            const data = JSON.parse(event.data);
            document.getElementById('count').textContent = data.usuarios;
        };

        socket.onerror = function () {
            document.getElementById('status').textContent = 'Error de conexión';
        };

        socket.onclose = function () {
            document.getElementById('status').textContent = 'Desconectado';
        };
    </script>
</body>
</html>
