<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludix</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }

        header {
            padding: 24px;
            background-color: #263238;
            color: white;
        }

        main {
            padding: 40px 24px;
            text-align: center;
        }

        .usuarios-conectados {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 8px;
            background-color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
            font-weight: bold;
        }

        .icono-usuarios {
            font-size: 22px;
        }

        #contador-usuarios {
            color: #1976d2;
        }
    </style>
</head>
<script>
    const protocolo = window.location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(
        `${protocolo}://${window.location.host}/ws/usuarios/`
    );

    socket.onmessage = function(evento) {
        const datos = JSON.parse(evento.data);

        document.getElementById("contador-usuarios").textContent =
            datos.usuarios;
    };

    socket.onclose = function() {
        console.log("Conexión WebSocket cerrada");
    };

    socket.onerror = function(error) {
        console.error("Error en WebSocket:", error);
    };
</script>
<body>
    <header>
        <h1>Ludix</h1>
    </header>

    <main>
        <h2>Bienvenido a Ludix</h2>
        <p>Esta será nuestra pantalla de pruebas para WebSockets.</p>
    </main>

    <div class="usuarios-conectados">
        <span class="icono-usuarios">👥</span>
        <span>
            Usuarios conectados:
            <span id="contador-usuarios">0</span>
        </span>
    </div>
</body>
</html>
